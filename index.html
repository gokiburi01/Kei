<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pose App with Loader</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    /* ロード画面 */
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.85);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-size: 24px;
      transition: opacity 0.6s ease;
    }

    /* ローディングアニメーション */
    .spinner {
      margin-top: 20px;
      width: 40px;
      height: 40px;
      border: 4px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* カメラ描画 */
    #video {
      display: none;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.3/vision_bundle.js"></script>
  <script defer src="app.js"></script>
</head>
<body>

  <!-- ロード画面 -->
  <div id="loader">
    <div id="loader-text">ロード中です…</div>
    <div class="spinner"></div>
  </div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

</body>
</html>
