<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集中力向上トレーニングアプリ</title>
<link rel="stylesheet" href="app.css">
<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
<!-- MoveNet -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
</head>
<body>
<!-- 初期設定画面 -->
<div id="setupScreen">
    <div class="setupCard">
        <h1>集中力向上トレーニングアプリ</h1>
        <p class="description">
            運動を通して集中力向上を目指します
        </p>
        <label>身長(cm)</label>
        <input
            type="number"
            id="heightInput"
            placeholder="170"
        >
        <label>体重(kg)</label>
        <input
            type="number"
            id="weightInput"
            placeholder="60"
        >
        <label>年齢</label>
        <input
            type="number"
            id="ageInput"
            placeholder="18"
        >
        <label>性別</label>
        <select id="genderInput">
            <option value="male">男性</option>
            <option value="female">女性</option>
        </select>
        <button id="startBtn">
            開始
        </button>
    </div>
</div>
<!-- ロード画面 -->
<div id="loadingScreen">
    <div class="loadingBox">
        <h2>モデル読込中...</h2>
        <div id="loadingText">
            準備中...
        </div>
    </div>
</div>
<!-- 注意表示 -->
<div id="safetyMessage">
    ⚠ 人が周りにいないことを確認してください
</div>
<!-- 警告表示 -->
<div id="warning"></div>
<!-- 情報パネル -->
<div id="statsPanel">
    <div class="statCard">
        <div class="label">スクワット</div>
        <div id="sq" class="value">0</div>
    </div>
    <div class="statCard">
        <div class="label">ジャンプ</div>
        <div id="jp" class="value">0</div>
    </div>
    <div class="statCard">
        <div class="label">消費kcal</div>
        <div id="kcal" class="value">0</div>
    </div>
    <div class="statCard">
        <div class="label">集中力スコア</div>
        <div id="score" class="value">0</div>
    </div>
</div>
<!-- FPS表示 -->
<div id="fpsPanel">
    FPS :
    <span id="fpsValue">0</span>
</div>
<!-- リセットボタン -->
<button id="resetBtn">
    リセット
</button>
<!-- カメラ -->
<video
    id="video"
    autoplay
    playsinline
    muted
    style="display:none;"
></video>
<!-- 描画領域 -->
<canvas id="canvas"></canvas>
<!-- メインJS -->
<script src="app.js"></script>
</body>
</html>
