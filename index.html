<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pose Counter</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #infoBox {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 6px;
        }
        #warning {
            color: red;
            font-weight: bold;
        }
        button {
            margin-top: 200px;
            padding: 10px 20px;
            font-size: 18px;
        }
        #loading {
            margin-top: 40px;
            color: #0f0;
        }
    </style>
</head>
<body>

<h2 id="loading">📡 モデルを読み込み中…</h2>

<div id="infoBox">
    <div>屈伸：<span id="squatCount">0</span></div>
    <div>ジャンプ：<span id="jumpCount">0</span></div>
    <div id="warning"></div>
</div>

<button id="resetBtn">リセット</button>

<video id="camera" autoplay playsinline></video>
<canvas id="output"></canvas>

<!-- ★ CDN を確実なバージョンに固定 ★ -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<script src="app.js"></script>
</body>
</html>
