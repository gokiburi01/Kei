<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集中力向上トレーニングアプリ</title>
    <link rel="stylesheet" href="app.css">
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
    <!-- MoveNet -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
</head>
<body>
    <!-- ロード画面 -->
    <div id="loadingScreen">
        <h1>集中力向上トレーニングアプリ</h1>
        <div id="loadingText">準備中...</div>
    </div>
    <!-- 初期設定 -->
    <div id="setupScreen">
        <h1>集中力向上トレーニングアプリ</h1>
        <div class="inputGroup">
            <label>身長(cm)</label>
            <input type="number" id="heightInput" placeholder="170">
        </div>
        <div class="inputGroup">
            <label>体重(kg)</label>
            <input type="number" id="weightInput" placeholder="60">
        </div>
        <div class="inputGroup">
            <label>年齢</label>
            <input type="number" id="ageInput" placeholder="16">
        </div>
        <div class="inputGroup">
            <label>性別</label>
            <select id="genderInput">
                <option value="male">男性</option>
                <option value="female">女性</option>
            </select>
        </div>
        <button id="startBtn">
            トレーニング開始
        </button>
    </div>
    <!-- タイトル -->
    <div id="title">
        集中力向上トレーニングアプリ
    </div>
    <!-- 安全表示 -->
    <div id="safety">
        ⚠ 人が周りにいないことを確認してください
    </div>
    <!-- 警告 -->
    <div id="warning"></div>
    <!-- 情報パネル -->
    <div id="cards">
        <div class="card">
            <h3>スクワット</h3>
            <span id="sq">0</span>
        </div>
        <div class="card">
            <h3>ジャンプ</h3>
            <span id="jp">0</span>
        </div>
        <div class="card">
            <h3>消費kcal</h3>
            <span id="kcal">0</span>
        </div>
        <div class="card">
            <h3>集中力スコア</h3>
            <span id="score">0</span>
        </div>
    </div>
    <!-- FPS -->
    <div id="fps">
        FPS :
        <span id="fpsValue">0</span>
    </div>
    <!-- ボタン -->
    <button id="resetBtn">
        リセット
    </button>
    <button id="switchCameraBtn">
        カメラ切替
    </button>
    <!-- カメラ -->
    <video
        id="video"
        autoplay
        playsinline
        muted
        style="display:none;">
    </video>
    <!-- 描画 -->
    <canvas id="canvas"></canvas>
    <script src="app.js"></script>
</body>
</html>
