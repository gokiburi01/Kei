<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Counter</title>

<link rel="stylesheet" href="app.css">

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js"></script>
</head>

<body>

<div id="warning"></div>

<div id="stats">
  Squat: <span id="sq">0</span><br>
  Jump: <span id="jp">0</span>
</div>

<button id="startBtn">開始</button>
<button id="resetBtn">リセット</button>
<button id="switchCameraBtn">カメラ切替</button>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>

<script src="app.js"></script>
</body>
</html>
