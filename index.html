<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Counter</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: sans-serif;
        }

        #video {
            display: none;
        }

        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* ---- 警告 ---- */
        #warning {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 20px;
            display: none;
            z-index: 9999;
        }

        /* ---- ボタン ---- */
        #resetBtn, #switchCameraBtn {
            position: fixed;
            bottom: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 9999;
        }

        #resetBtn {
            left: 20px;
            background: red;
            color: white;
        }

        #switchCameraBtn {
            right: 20px;
            background: #0066ff;
            color: white;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js"></script>
</head>

<body>

    <div id="warning">全身が映っていません</div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <button id="resetBtn">リセット</button>
    <button id="switchCameraBtn">カメラ切替</button>

    <script src="app.js"></script>
</body>
</html>
